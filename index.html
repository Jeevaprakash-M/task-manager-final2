<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sprint 2 Task Manager</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

</head>

<body class="bg-light">

  <div class="container py-5">

    <!-- Heading -->
    <h1 class="text-center mb-5">
      Sprint 2 Task Manager
    </h1>

    <!-- Form -->
    <div class="card p-4 shadow-sm mb-5">

      <h3 class="mb-4">
        Add New Task
      </h3>

      <form id="taskForm">

        <!-- Task Name -->
        <div class="mb-3">

          <label class="form-label">
            Task Name
          </label>

          <input
            type="text"
            id="taskName"
            class="form-control"
          />

          <small
            class="text-danger"
            id="nameError"
          ></small>

        </div>

        <!-- Description -->
        <div class="mb-3">

          <label class="form-label">
            Description
          </label>

          <textarea
            id="description"
            class="form-control"
            rows="3"
          ></textarea>

          <small
            class="text-danger"
            id="descriptionError"
          ></small>

        </div>

        <!-- Assigned To -->
        <div class="mb-3">

          <label class="form-label">
            Assigned To
          </label>

          <input
            type="text"
            id="assignedTo"
            class="form-control"
          />

          <small
            class="text-danger"
            id="assignedError"
          ></small>

        </div>

        <!-- Due Date -->
        <div class="mb-3">

          <label class="form-label">
            Due Date
          </label>

          <input
            type="date"
            id="dueDate"
            class="form-control"
          />

          <small
            class="text-danger"
            id="dateError"
          ></small>

        </div>

        <!-- Status -->
        <div class="mb-3">

          <label class="form-label">
            Status
          </label>

          <select
            id="status"
            class="form-select"
          >

            <option value="">
              Select Status
            </option>

            <option>
              TODO
            </option>

            <option>
              IN PROGRESS
            </option>

            <option>
              REVIEW
            </option>

            <option>
              DONE
            </option>

          </select>

          <small
            class="text-danger"
            id="statusError"
          ></small>

        </div>

        <!-- Priority -->
        <div class="mb-4">

          <label class="form-label">
            Priority
          </label>

          <select
            id="priority"
            class="form-select"
          >

            <option value="">
              Select Priority
            </option>

            <option>
              LOW
            </option>

            <option>
              MEDIUM
            </option>

            <option>
              URGENT
            </option>

          </select>

          <small
            class="text-danger"
            id="priorityError"
          ></small>

        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="btn btn-primary"
        >
          Add Task
        </button>

      </form>

    </div>

    <!-- Task List -->
    <div>

      <h3 class="mb-4">
        Task List
      </h3>

      <div
        class="row"
        id="taskList"
      ></div>

    </div>

  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>

</html>
